name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build static site
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: pnpm run build

      - name: Upload dist to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          source: "dist/*"
          target: "${{ secrets.DEPLOY_DIST_PATH }}.tmp"
          strip_components: 1

      - name: Swap new dist into place
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            setopt NULL_GLOB
            DEPLOY_PATH="${{ secrets.DEPLOY_DIST_PATH }}"
            if [ -d "$DEPLOY_PATH" ]; then
              rm -rf "$DEPLOY_PATH.old"
              mv "$DEPLOY_PATH" "$DEPLOY_PATH.old"
            fi
            mv "$DEPLOY_PATH.tmp" "$DEPLOY_PATH"
            rm -rf "$DEPLOY_PATH.old"
